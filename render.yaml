# Render Blueprint for the Taxoryn backend (Spring Boot API).
# Docs: https://render.com/docs/blueprint-spec
#
# This file manages deployment/runtime settings for the Taxoryn production service (SPRING_PROFILES_ACTIVE=prod).
# For production deployments, deploy with SPRING_PROFILES_ACTIVE=prod and inject required secrets
# via the Render dashboard Environment tab:
#   - Database: DB_URL, DB_USERNAME, DB_PASSWORD
#   - Security: JWT_SECRET
#   - Document Storage (Cloudflare R2 / S3): STORAGE_BUCKET, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY, STORAGE_ENDPOINT
#   - Notifications: RESEND_API_KEY (or MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD)
#
# Production strictly fails fast at startup if any required secret or storage configuration is missing, weak, or insecure.
#
# See docs/RENDER_KEEPALIVE.md for the full explanation of the health check and keep-alive setup.

services:
  - type: web
    name: taxoryn-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8088
      - key: SERVER_PORT
        value: 8088
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx192m -Xss384k -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=200m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"
      - key: STORAGE_PROVIDER
        value: S3
      - key: STORAGE_REGION
        value: auto
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLAMAV_ENABLED
        value: "false"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
