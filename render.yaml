# Render Blueprint for the Taxoryn backend (Spring Boot API).
# Docs: https://render.com/docs/blueprint-spec
#
# This file only manages deployment/runtime settings for the existing Render Web Service.
# It does not provision a managed Postgres instance - Taxoryn already points at an
# externally configured database via the SPRING_DATASOURCE_* / DB_* environment variables
# (see application-demo.yml / application-prod.yml). Set those in the Render dashboard's
# "Environment" tab for this service, they are intentionally not duplicated here.
#
# See docs/RENDER_KEEPALIVE.md for the full explanation of the health check and keep-alive setup.

services:
  - type: web
    name: taxoryn-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: SERVER_PORT
        value: 8088
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx220m -Xss512k -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"
