# Render Blueprint for the Taxoryn backend (Spring Boot API).
# Docs: https://render.com/docs/blueprint-spec
#
# This file manages deployment/runtime settings for the public demo service (SPRING_PROFILES_ACTIVE=demo).
# For production deployments, deploy with SPRING_PROFILES_ACTIVE=prod and inject required secrets
# (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET) via the Render dashboard Environment tab.
# Production strictly fails fast at startup if any required secret is missing or insecure.
#
# See docs/RENDER_KEEPALIVE.md for the full explanation of the health check and keep-alive setup.

services:
  - type: web
    name: taxoryn-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: SERVER_PORT
        value: 8088
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx220m -Xss512k -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"
