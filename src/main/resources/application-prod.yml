spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxoryn_db}
    username: ${SPRING_DATASOURCE_USERNAME:taxoryn_user}
    password: ${SPRING_DATASOURCE_PASSWORD:taxoryn_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: TaxorynHikariPool
  flyway:
    validate-on-migrate: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:taxoryn@gmail.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          ssl:
            enable: ${SMTP_SSL:true}
            trust: "*"
          socketFactory:
            port: ${SMTP_PORT:465}
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

# Hardened Security & Rate Limiting
taxoryn:
  auth:
    reset-password-base-url: ${TAXORYN_RESET_PASSWORD_URL:https://taxoryn.com/reset-password}
  mail:
    enabled: ${MAIL_ENABLED:true}
    provider: ${MAIL_PROVIDER:SMTP}
    from-email: ${MAIL_FROM_EMAIL:taxoryn@gmail.com}
    from-name: ${MAIL_FROM_NAME:Taxoryn}
    login-url: ${TAXORYN_LOGIN_URL:https://taxoryn.com/login}
  jwt:
    # SECURITY: no default here on purpose. JWT_SECRET MUST be supplied via environment
    # variable in production (256-bit+ random value). JwtTokenProvider fails fast at startup
    # if this resolves to the known repository-default secret while running a non-local profile.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: ${JWT_ISSUER:taxoryn-platform}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://taxoryn.com,https://*.taxoryn.com,https://app.taxoryn.com,https://portal.taxoryn.com}
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-limit: ${RATE_LIMIT_AUTH:15}
    api-limit: ${RATE_LIMIT_API:300}
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./data/documents}
    s3:
      bucket-name: ${STORAGE_S3_BUCKET:taxoryn-production-documents}
      region: ${STORAGE_S3_REGION:ap-south-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}

# Production Observability & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Clean Production Logging
logging:
  level:
    root: INFO
    com.taxoryn: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
