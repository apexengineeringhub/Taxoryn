spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: TaxorynHikariPool
  flyway:
    validate-on-migrate: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  mail:
    host: ${MAIL_HOST:${SMTP_HOST:}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          ssl:
            enable: ${SMTP_SSL:false}
          trust: "*"
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

# Hardened Security & Rate Limiting
taxoryn:
  demo:
    enabled: false
  frontend:
    reset-password-url: ${TAXORYN_RESET_PASSWORD_URL:https://taxoryn.com/reset-password}
  auth:
    reset-password-base-url: ${TAXORYN_RESET_PASSWORD_URL:https://taxoryn.com/reset-password}
  mail:
    enabled: ${MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:SMTP}
    from-email: ${MAIL_FROM_EMAIL:notifications@taxoryn.com}
    from-name: ${MAIL_FROM_NAME:Taxoryn}
    login-url: ${TAXORYN_LOGIN_URL:https://taxoryn.com/login}
    resend-api-key: ${RESEND_API_KEY:}
    brevo-api-key: ${BREVO_API_KEY:}
  jwt:
    # SECURITY: Injected via JWT_SECRET runtime variable.
    # ProductionSecurityValidator ensures secret is non-null, >= 256 bits, and not a known default.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: ${JWT_ISSUER:taxoryn-platform}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://taxoryn.com,https://*.taxoryn.com,https://app.taxoryn.com,https://portal.taxoryn.com}
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-limit: ${RATE_LIMIT_AUTH:15}
    api-limit: ${RATE_LIMIT_API:300}
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:/app/data/documents}
    s3:
      bucket: ${STORAGE_BUCKET:${STORAGE_S3_BUCKET:}}
      region: ${STORAGE_REGION:${STORAGE_S3_REGION:ap-south-1}}
      access-key: ${STORAGE_ACCESS_KEY:${STORAGE_S3_ACCESS_KEY:}}
      secret-key: ${STORAGE_SECRET_KEY:${STORAGE_S3_SECRET_KEY:}}
      endpoint: ${STORAGE_ENDPOINT:${STORAGE_S3_ENDPOINT:}}

# Production Observability & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Clean Production Logging
logging:
  level:
    root: INFO
    com.taxoryn: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
