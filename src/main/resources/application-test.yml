spring:
  datasource:
    url: jdbc:h2:mem:taxoryn_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  frontend-url: http://localhost:5173

taxoryn:
  frontend-url: ${app.frontend-url}
  frontend:
    activation-url: ${taxoryn.frontend-url}/activate
    reset-password-url: ${taxoryn.frontend-url}/reset-password
    login-url: ${taxoryn.frontend-url}/login
  auth:
    activation-url: ${taxoryn.frontend.activation-url}
    activation-base-url: ${taxoryn.frontend.activation-url}
    reset-password-url: ${taxoryn.frontend.reset-password-url}
    reset-password-base-url: ${taxoryn.frontend.reset-password-url}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 900000
    refresh-expiration-ms: 86400000
    issuer: taxoryn-test
  marketplace:
    search:
      default-radius-km: 10.0
      min-radius-km: 1.0
      max-radius-km: 100.0
      default-page-size: 12
      max-page-size: 50
  rate-limit:
    enabled: false
  whatsapp:
    enabled: false
    provider: MOCK
  mail:
    enabled: false
    provider: LOG
    from-email: info@taxoryn.com
    from-address: info@taxoryn.com
    from-name: Taxoryn
    reply-to: info@taxoryn.com
    frontend-url: ${taxoryn.frontend-url}
    login-url: ${taxoryn.frontend.login-url}
    activation-url: ${taxoryn.frontend.activation-url}

logging:
  level:
    root: WARN
    com.taxoryn: DEBUG
