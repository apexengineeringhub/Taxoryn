spring:
  datasource:
    url: jdbc:h2:mem:taxoryn_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

taxoryn:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
    issuer: taxoryn-test
  marketplace:
    search:
      default-radius-km: 10.0
      min-radius-km: 1.0
      max-radius-km: 100.0
      default-page-size: 12
      max-page-size: 50
  rate-limit:
    enabled: false
  whatsapp:
    enabled: false
    provider: MOCK
  mail:
    enabled: false
    provider: LOG

logging:
  level:
    root: WARN
    com.taxoryn: DEBUG
