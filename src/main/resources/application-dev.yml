spring:
  flyway:
    validate-on-migrate: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxoryn_db}
    username: ${SPRING_DATASOURCE_USERNAME:taxoryn_user}
    password: ${SPRING_DATASOURCE_PASSWORD:taxoryn_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

# Development Environment Settings & Local Defaults
taxoryn:
  jwt:
    # DEV ONLY: Known default secret used strictly for local developer convenience
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  storage:
    provider: LOCAL
    local:
      base-dir: ./data/documents

logging:
  level:
    root: INFO
    com.taxoryn: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
