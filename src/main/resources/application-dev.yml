spring:
  flyway:
    validate-on-migrate: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxoryn_db}
    username: ${SPRING_DATASOURCE_USERNAME:taxoryn_user}
    password: ${SPRING_DATASOURCE_PASSWORD:taxoryn_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

# Development Environment Settings & Local Defaults
taxoryn:
  jwt:
    # DEV ONLY: Known default secret used strictly for local developer convenience
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    presigned-url-duration-minutes: ${STORAGE_PRESIGNED_URL_DURATION_MINUTES:15}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./data/documents}
    s3:
      bucket: ${STORAGE_BUCKET:${STORAGE_S3_BUCKET:taxoryn-documents}}
      region: ${STORAGE_REGION:${STORAGE_S3_REGION:auto}}
      access-key: ${STORAGE_ACCESS_KEY:${STORAGE_S3_ACCESS_KEY:}}
      secret-key: ${STORAGE_SECRET_KEY:${STORAGE_S3_SECRET_KEY:}}
      endpoint: ${STORAGE_ENDPOINT:${STORAGE_S3_ENDPOINT:}}
      path-style-access: ${STORAGE_PATH_STYLE_ACCESS:false}

logging:
  level:
    root: INFO
    com.taxoryn: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
