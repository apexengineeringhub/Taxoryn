spring:
  application:
    name: taxoryn
  profiles:
    active: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8088
  servlet:
    context-path: /

# Taxoryn Security & JWT configuration
taxoryn:
  jwt:
    # 256-bit+ base64 encoded secret key for HMAC-SHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
    issuer: taxoryn-platform
  marketplace:
    search:
      default-radius-km: 10.0
      min-radius-km: 1.0
      max-radius-km: 100.0
      default-page-size: 12
      max-page-size: 50
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
