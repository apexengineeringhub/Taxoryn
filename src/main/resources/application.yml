spring:
  application:
    name: taxoryn
  profiles:
    active: dev
  config:
    import:
      - "optional:classpath:application-local.yml"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:${MAIL_HOST:}}
    port: ${SMTP_PORT:${MAIL_PORT:587}}
    username: ${SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${SMTP_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          ssl:
            enable: ${SMTP_SSL:false}
          trust: "*"
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:15000}
          timeout: ${SMTP_TIMEOUT:15000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:15000}

server:
  port: 8088
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

app:
  frontend-url: ${TAXORYN_FRONTEND_URL:${FRONTEND_URL:${APP_FRONTEND_URL:http://localhost:5173}}}

# Taxoryn Security & JWT configuration
taxoryn:
  frontend-url: ${app.frontend-url}
  frontend:
    activation-url: ${TAXORYN_ACTIVATION_URL:${taxoryn.frontend-url}/activate}
    reset-password-url: ${TAXORYN_RESET_PASSWORD_URL:${taxoryn.frontend-url}/reset-password}
    login-url: ${TAXORYN_LOGIN_URL:${taxoryn.frontend-url}/login}
  auth:
    activation-url: ${taxoryn.frontend.activation-url}
    activation-base-url: ${taxoryn.frontend.activation-url}
    reset-password-url: ${taxoryn.frontend.reset-password-url}
    reset-password-base-url: ${taxoryn.frontend.reset-password-url}
    cookie:
      name: ${TAXORYN_COOKIE_NAME:taxoryn_refresh_token}
      secure: ${TAXORYN_COOKIE_SECURE:false}
      same-site: ${TAXORYN_COOKIE_SAME_SITE:Lax}
      path: ${TAXORYN_COOKIE_PATH:/}
      domain: ${TAXORYN_COOKIE_DOMAIN:}
  jwt:
    # Externalized secret key for HMAC-SHA256 (injected per profile or environment)
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
    issuer: taxoryn-platform
  marketplace:
    search:
      default-radius-km: 10.0
      min-radius-km: 1.0
      max-radius-km: 100.0
      default-page-size: 12
      max-page-size: 50
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,https://taxoryn.com,https://app.taxoryn.com,https://taxoryn-7x7f.vercel.app}
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:true}
    provider: ${WHATSAPP_PROVIDER:LOG}
    base-url: ${WHATSAPP_BASE_URL:https://graph.facebook.com/v19.0}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    login-url: ${TAXORYN_LOGIN_URL:${taxoryn.frontend-url}/login}
  mail:
    enabled: ${MAIL_ENABLED:true}
    provider: ${MAIL_PROVIDER:AUTO}
    from-email: ${MAIL_FROM_ADDRESS:${MAIL_FROM_EMAIL:${TAXORYN_EMAIL_FROM:info@taxoryn.com}}}
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_FROM_EMAIL:${TAXORYN_EMAIL_FROM:info@taxoryn.com}}}
    from-name: ${MAIL_FROM_NAME:${TAXORYN_EMAIL_FROM_NAME:Taxoryn}}
    reply-to: ${MAIL_REPLY_TO:${TAXORYN_EMAIL_REPLY_TO:info@taxoryn.com}}
    frontend-url: ${taxoryn.frontend-url}
    login-url: ${TAXORYN_LOGIN_URL:${taxoryn.frontend-url}/login}
    activation-url: ${TAXORYN_ACTIVATION_URL:${taxoryn.frontend-url}/activate}
    resend-api-key: ${RESEND_API_KEY:}
    brevo-api-key: ${BREVO_API_KEY:}
    dev-mode: ${TAXORYN_MAIL_DEV_MODE:${MAIL_DEV_MODE:false}}
    dev-recipient: ${TAXORYN_MAIL_DEV_RECIPIENT:${MAIL_DEV_RECIPIENT:}}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
