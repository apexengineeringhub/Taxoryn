spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taxoryn_demo_db}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:taxoryn_demo_user}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:taxoryn_demo_secret}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: TaxorynDemoHikariPool
  flyway:
    validate-on-migrate: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  # Real SMTP transport for demo welcome/notification emails. Host/username/password
  # are set via SMTP_HOST/SMTP_USERNAME/SMTP_PASSWORD environment variables.
  # Defaults to smtp.gmail.com over port 465 SSL (bypasses cloud port 587 timeouts).
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:taxoryn@gmail.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          ssl:
            enable: ${SMTP_SSL:true}
            trust: "*"
          socketFactory:
            port: ${SMTP_PORT:465}
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

# Sized to match the Hikari pool above (max 5 connections), not Tomcat's 200-thread
# default. Without this, request threads vastly outnumber available DB connections
# and pile up waiting on the Hikari connection-timeout under any real concurrency.
server:
  tomcat:
    threads:
      max: 20
      min-spare: 5

# Demo-mode flags — surfaced to the frontend via /api/config or a dedicated
# endpoint so the UI can render a persistent "DEMO ENVIRONMENT" banner.
# Never point this profile at real customer or production data.
taxoryn:
  demo:
    enabled: true
    banner-text: "DEMO ENVIRONMENT — Synthetic data only. Not for real tax filings."
  frontend:
    reset-password-url: ${TAXORYN_RESET_PASSWORD_URL:https://taxoryn.com/reset-password}
  auth:
    reset-password-base-url: ${TAXORYN_RESET_PASSWORD_URL:https://taxoryn.com/reset-password}
  mail:
    enabled: ${MAIL_ENABLED:true}
    provider: ${MAIL_PROVIDER:AUTO}
    from-email: ${MAIL_FROM_EMAIL:taxoryn@gmail.com}
    from-name: ${MAIL_FROM_NAME:Taxoryn}
    login-url: ${TAXORYN_LOGIN_URL:https://taxoryn.com/login}
    resend-api-key: ${RESEND_API_KEY:}
    brevo-api-key: ${BREVO_API_KEY:}
  jwt:
    # SECURITY: no default here on purpose - see application-prod.yml note. The demo
    # environment is public-facing, so it must not fall back to the known repo default either.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ${JWT_ISSUER:taxoryn-demo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8089,https://taxoryn.com,https://*.taxoryn.com,https://taxoryn-7x7f.vercel.app,https://*.vercel.app}
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-limit: ${RATE_LIMIT_AUTH:30}
    api-limit: ${RATE_LIMIT_API:600}
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./data/documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Render keep-alive / uptime monitoring for this profile:
# This is the profile Render runs (SPRING_PROFILES_ACTIVE=demo, see Dockerfile / render.yaml).
# GET /api/health (com.taxoryn.core.health.HealthController) is the endpoint Render's
# healthCheckPath and any external uptime monitor should call — it is public, does not
# query PostgreSQL, and does not depend on the management config above.
# /actuator/health (configured above) stays available too, for local Docker health checks
# and deeper diagnostics, but it aggregates indicators including a DB check.
# See docs/RENDER_KEEPALIVE.md for the full setup.

# Verbose-enough logging to debug the demo without leaking sensitive fields
# (PAN/Aadhaar/bank/JWT/documents are never logged — see LoggingMasker / MDC filters)
logging:
  level:
    root: INFO
    com.taxoryn: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
