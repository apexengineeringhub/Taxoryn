version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxoryn_app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8088}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taxoryn_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-taxoryn_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://taxoryn.com,https://*.taxoryn.com}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      STORAGE_LOCAL_BASE_DIR: /app/data/documents
    volumes:
      - taxoryn_documents:/app/data/documents
      - taxoryn_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - taxoryn-network

  postgres:
    image: postgres:16-alpine
    container_name: taxoryn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxoryn_db}
      POSTGRES_USER: ${POSTGRES_USER:-taxoryn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taxoryn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxoryn_user} -d ${POSTGRES_DB:-taxoryn_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxoryn-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taxoryn_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@taxoryn.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxoryn-network
    profiles:
      - tools

volumes:
  taxoryn_pgdata:
    driver: local
  taxoryn_documents:
    driver: local
  taxoryn_logs:
    driver: local

networks:
  taxoryn-network:
    driver: bridge
