<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav_bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#082E5B" />
      <stop offset="100%" stopColor="#061A38" />
    </linearGradient>

    <linearGradient id="fav_t" x1="20" y1="12" x2="75" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#F8FAFC" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </linearGradient>

    <filter id="fav_t_shadow" x="12" y="10" width="74" height="58" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2.5" stdDeviation="2" floodColor="#000000" floodOpacity="0.45" />
    </filter>

    <linearGradient id="fav_teal" x1="45" y1="20" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00E5B3" />
      <stop offset="45%" stopColor="#00D1A3" />
      <stop offset="100%" stopColor="#009E77" />
    </linearGradient>

    <linearGradient id="fav_swoosh" x1="15" y1="35" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#00D1A3" />
      <stop offset="100%" stopColor="#00E5B3" />
    </linearGradient>

    <filter id="fav_doc_shadow" x="40" y="28" width="38" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" floodColor="#000000" floodOpacity="0.3" />
    </filter>
  </defs>

  <!-- Background App Icon Tile with Rounded Corners -->
  <rect width="100" height="100" rx="22" fill="url(#fav_bg)" />

  <!-- Base Swoosh -->
  <path d="M 19 36 C 10 56, 16 82, 42 88 C 64 92, 78 82, 86 68" stroke="url(#fav_swoosh)" strokeWidth="4.5" strokeLinecap="round" fill="none" opacity="0.95" />

  <!-- R-Letter Arch -->
  <path d="M 48 24 H 65 C 77 24, 85 30, 85 41 C 85 51, 75 57, 61 57 H 49 M 61 57 L 80 80" stroke="url(#fav_teal)" strokeWidth="11" strokeLinecap="round" strokeLinejoin="round" fill="none" />

  <!-- T-Letter Stem -->
  <g filter="url(#fav_t_shadow)">
    <path d="M 22 14 L 78 14 L 72 23 L 53 23 L 41 52 L 27 60 L 37 23 L 17 23 Z" fill="url(#fav_t)" stroke="#FFFFFF" strokeWidth="0.5" strokeLinejoin="round" />
  </g>

  <!-- Growth Bars -->
  <rect x="24" y="66" width="4.5" height="12" rx="2" fill="url(#fav_teal)" />
  <rect x="31" y="56" width="4.5" height="22" rx="2" fill="url(#fav_teal)" />
  <rect x="38" y="46" width="4.5" height="32" rx="2" fill="url(#fav_teal)" />

  <!-- Center Tax Document -->
  <g filter="url(#fav_doc_shadow)">
    <path d="M 44 32 H 72 V 64 L 66 70 H 44 Z" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1.2" />
    <path d="M 66 64 H 72 L 66 70 Z" fill="#94A3B8" />
    <text x="56" y="43" textAnchor="middle" fill="#07152B" fontSize="8" fontWeight="900" fontFamily="system-ui, sans-serif" letterSpacing="0.8">TAX</text>
    <line x1="48" y1="48" x2="68" y2="48" stroke="#94A3B8" strokeWidth="1.5" strokeLinecap="round" />
    <line x1="48" y1="52" x2="68" y2="52" stroke="#CBD5E1" strokeWidth="1.5" strokeLinecap="round" />
    <line x1="48" y1="56" x2="62" y2="56" stroke="#CBD5E1" strokeWidth="1.5" strokeLinecap="round" />
    <circle cx="56" cy="62" r="5" fill="#00D1A3" />
    <path d="M 53.5 62 L 55.2 63.7 L 58.7 60.2" stroke="#FFFFFF" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" fill="none" />
  </g>
</svg>
